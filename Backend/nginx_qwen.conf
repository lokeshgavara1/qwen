# NGINX Configuration for CUTM AI Gateway
# Location: Run on Central Server (192.168.5.200 / qwen.cutm.ac.in)
# Target: Proxies all public traffic directly to the GPU Workstation (172.16.8.170:8000)

upstream ai_gateway_workstation {
    server 172.16.8.170:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 1. HTTP Server (Redirect to HTTPS if SSL is enabled, or proxy directly)
server {
    listen 80;
    server_name qwen.cutm.ac.in;

    client_max_body_size 50M;

    # Proxy all traffic (Frontend UI, API endpoints, SSE streams, WebSockets)
    # directly to the dedicated GPU Workstation at 172.16.8.170:8000
    location / {
        proxy_pass http://ai_gateway_workstation;
        proxy_http_version 1.1;

        # Connection & header preservation
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time LLM token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 2. HTTPS Server (Active when Certbot / SSL certificates are installed)
server {
    listen 443 ssl http2;
    server_name qwen.cutm.ac.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/qwen.cutm.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwen.cutm.ac.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Proxy all requests to the GPU Workstation
    location / {
        proxy_pass http://ai_gateway_workstation;
        proxy_http_version 1.1;

        # WebSocket & connection upgrading
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming token latency optimization
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
