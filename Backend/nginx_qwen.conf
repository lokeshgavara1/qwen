# NGINX Configuration for Qwen AI Gateway
# Place this in /etc/nginx/sites-available/qwen (or /etc/nginx/conf.d/qwen.conf)
# Enable with: sudo ln -s /etc/nginx/sites-available/qwen /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name qwen.cutm.ac.in;

    # Point directly to your Frontend directory
    # (Adjust path to where your repository is cloned, e.g. /root/qwen/Frontend or /var/www/qwen/Frontend)
    root /root/qwen/Frontend;
    index index.html;

    client_max_body_size 50M;

    # 1. Static Frontend UI files
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # 2. Proxy API, Image Generation, and Health endpoints to Python Backend (port 8000)
    location ~ ^/(api|v1|health|status|generated_images) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time LLM token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
